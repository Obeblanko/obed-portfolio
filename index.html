<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obed Blankson | Data Analyst and Front-end Developer</title>
    <meta
      name="description"
      content="Obed Blankson is an IT graduate who turns data into decisions and ideas into clean interfaces, building toward a youth tech hub in Ghana."
    />
    <meta name="theme-color" content="#0B6E6E" />

    <!-- Social preview. After you deploy, change the image URL to the full
         address, e.g. https://your-site.vercel.app/og-image.png -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Obed Blankson | Data Analyst and Front-end Developer" />
    <meta property="og:description" content="Turning data into decisions and ideas into clean interfaces." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before the page paints, so there is no flash. -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
